# Runs the whole app locally with one command: docker compose up --build
# 3 containers: postgres database, FastAPI backend, Next.js frontend
# Needs backend/.env and frontend/.env.local to exist first (copy the .example files)
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: couple
      POSTGRES_PASSWORD: couple
      POSTGRES_DB: couple_calendar
    volumes:
      - pgdata:/var/lib/postgresql/data # keeps the data when containers restart
    ports:
      - "5432:5432"
    # backend waits for this to pass, otherwise migrations run before postgres is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couple -d couple_calendar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    # "db" here is the name of the postgres service above (docker's internal network)
    environment:
      DATABASE_URL: postgresql+asyncpg://couple:couple@db:5432/couple_calendar
      DATABASE_URL_SYNC: postgresql://couple:couple@db:5432/couple_calendar
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # update the db tables first, then start the server (--reload restarts it when code changes)
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
